[project]
name = "app-certificados"
version = "0.1.0"
description = "App de Certificados de la Academia"
requires-python = ">=3.12"
dependencies = [
    "flask",
    "pandas",
    "openpyxl",
    "fpdf2",
    "psycopg[binary]",
    "python-dotenv",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

# Vercel detecta Flask automáticamente. Esta línea le indica que la app está
# en app.py y que el objeto Flask se llama "app".
[tool.vercel]
entrypoint = "app:app"
